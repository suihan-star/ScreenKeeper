<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>屏幕良伴 · 健康提醒与隐私幕</title>
<link rel="icon" href="settings-v2-icon.svg" type="image/svg+xml">
<style>
:root{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#173326;background:#e4e9dd;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:28px 32px}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #648858;outline-offset:4px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}h1{font-size:19px;font-weight:600;margin:0 0 6px}header p{font-size:12px;color:#5b6b5d;margin:0}nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap}nav button,nav select{border:1px solid #b6c4b0;background:transparent;color:#264632;border-radius:6px;padding:8px 12px;font-size:12px}nav button[aria-pressed=true]{background:#214c39;color:#edf2e8;border-color:#214c39}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:26px;max-width:1500px;margin:auto}.preview-column{min-width:0}.display{position:relative;display:grid;place-items:center;min-height:470px;height:min(70vh,700px);border:1px solid #5f765d;border-radius:12px;background:#102a23 url('forest-mist.png') center/cover;overflow:hidden;isolation:isolate}.display:before{content:"";position:absolute;inset:0;background:#0c281cb3;z-index:-1}.display.privacy:before{background:#0c281c45}.caption{color:#5b6b5d;font-size:11px;line-height:1.8;margin:13px 0 0}.health-card{width:430px;max-width:calc(100% - 40px);background:#17372e;color:#e8efe5;border:1px solid #3e6250;border-radius:12px;padding:24px 28px 26px;box-shadow:0 16px 48px #06190d30}.card-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.card-heading h2{font-size:21px;font-weight:500;line-height:28px;margin:0}.close{width:28px;height:28px;flex-shrink:0;border:0;background:transparent;color:#acc2b3;border-radius:6px;font-size:21px;line-height:1}.close:hover{background:#294c3c}.copy{font-size:14px;line-height:24px;color:#acc2b3;margin:16px 0 22px;white-space:pre-line}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.action{padding:10px 14px;min-height:40px;border:1px solid #acc2b3;border-radius:7px;font-size:13px;background:transparent;color:#e8efe5;line-height:18px;transition:background .15s}.action:hover{background:#294c3c}.action:active{opacity:.8}.action.primary{background:#b4d6a1;color:#173326;border-color:#b4d6a1;font-weight:600}.action.primary:hover{background:#c4e2b5}.action.quiet{border-color:transparent;color:#acc2b3}.health-card button:focus-visible,.enter:focus-visible{outline:2px solid #d4e9c6;outline-offset:3px}.countdown{font-size:48px;font-weight:300;margin:0 0 20px;font-variant-numeric:tabular-nums}.enter{font:14px "Segoe UI","Microsoft YaHei UI",sans-serif;background:#17372edb;color:#e8efe5;border:1px solid #acc2b3;border-radius:8px;padding:13px 26px;cursor:pointer}.enter:hover{background:#214c39}.demo-result{color:#e8efe5;text-align:center;background:#17372e;padding:20px;border-radius:8px;font-size:14px}.demo-result button{display:block;margin:16px auto 0}.hidden{display:none!important}aside h2{font-size:15px;font-weight:600;margin:0 0 7px}aside>p{font-size:11px;color:#5b6b5d;line-height:1.8;margin:0 0 12px}.copy-choice{display:block;text-align:left;width:100%;background:transparent;color:#264632;border:1px solid #bcc9b5;border-radius:8px;padding:12px 14px;margin-bottom:9px}.copy-choice[aria-pressed=true]{background:#f0f3ea;border-color:#3f674c;box-shadow:inset 3px 0 #3f674c}.copy-choice strong{font-size:11px;font-weight:600;display:block;margin-bottom:5px}.copy-choice span{font-size:12px;line-height:1.8;display:block}.copy-choice:hover{background:#edf1e6}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:#5b6b5d;margin-top:14px}.legend span{display:flex;gap:6px;align-items:center}.legend i{width:9px;height:9px;background:#b4d6a1;border:1px solid #769269;border-radius:2px}.legend span:nth-child(2) i{background:transparent}.legend span:nth-child(3) i{border:0;border-bottom:1px solid #5b6b5d;border-radius:0;height:2px}footer{font-size:11px;color:#637460;line-height:1.8;max-width:1500px;margin:20px auto 0}@media(max-width:980px){body{padding:20px}.workspace{grid-template-columns:1fr}.display{height:560px;min-height:400px}aside{display:grid;grid-template-columns:1fr 1fr;gap:10px}aside h2,aside>p{grid-column:1/-1}.copy-choice{margin:0}}@media(max-width:540px){body{padding:14px}header{align-items:flex-start;flex-direction:column}.display{height:480px}.health-card{max-width:calc(100% - 24px);padding:22px}.actions{gap:6px}.action{padding:10px 11px}aside{grid-template-columns:1fr}.card-heading h2{font-size:20px}}
</style>
</head>
<body>
<header><div><h1>健康提醒 · 轻轻提醒，好好休息</h1><p>居中卡片 / 更清楚的操作层级 / 三组文案对照</p></div><nav aria-label="预览控制"><button id="reminderTab" aria-pressed="true">健康提醒</button><button id="privacyTab" aria-pressed="false">隐私幕</button><button id="reset">重新预览</button><select id="language" aria-label="预览语言"><option value="zh">简体中文</option><option value="en">English</option></select></nav></header>
<main class="workspace"><section class="preview-column"><div class="display" id="display" aria-label="模拟屏幕">
<section class="health-card" id="card" role="dialog" aria-labelledby="cardTitle" aria-describedby="cardCopy"><div class="card-heading"><h2 id="cardTitle">该休息一下了</h2><button class="close" id="close" aria-label="关闭">×</button></div><p class="copy" id="cardCopy"></p><div class="countdown hidden" id="countdown">05:00</div><div class="actions" id="actions"></div></section>
<button class="enter hidden" id="enter">进入此屏幕</button><div class="demo-result hidden" id="result" role="status"></div>
</div><div class="legend"><span><i></i>开始休息：实心主操作</span><span><i></i>稍后：描边次操作</span><span><i></i>跳过本次：低强调文字</span></div><p class="caption">430 像素宽的卡片位于屏幕正中间；隐私幕仍只保留一个进入按钮。效果稿不会操作真实屏幕或工作周期。</p></section>
<aside aria-label="选择提醒正文"><h2>哪一句，更像你的屏幕良伴？</h2><p id="copyStatus">点击切换左侧效果。当前预览第 1 组，不代表已选定客户端正文。</p><div id="choices" style="display:contents"></div></aside></main>
<footer>保留当前深绿风格和山林背景。这里展示的是操作卡与文案，实际背景覆盖程度仍由原设置控制。</footer>
<script>
'use strict';
const copies=[
['自然温柔 · 推荐','专注了这么久，辛苦啦。眨眨眼，伸个懒腰，让紧绷的身体慢慢放松下来。','You’ve been focused for a while. Blink, have a gentle stretch, and let your body slowly relax.'],
['多一点关怀','专注了这么久，辛苦啦。眨眨眼睛，轻轻伸个懒腰，给认真工作的自己一点放松的时间。','You’ve been focused for a while. Blink and stretch gently. Give yourself a little time to relax after all that work.'],
['舒缓有节奏','专注了这么久，辛苦啦。让眼睛歇一歇，让身体舒展一下，把这片刻的轻松留给自己。','You’ve been focused for a while. Rest your eyes, stretch your body, and enjoy this little moment for yourself.']
];
let choice=0,phase='reminder',language='zh',remaining=300,timer=null;
const el=id=>document.getElementById(id),t=(zh,en)=>language==='en'?en:zh;
function action(text,kind,handler){const button=document.createElement('button');button.type='button';button.className='action '+kind;button.textContent=text;button.onclick=handler;el('actions').append(button);}
function finish(message){clearInterval(timer);timer=null;phase='dismissed';el('card').classList.add('hidden');el('enter').classList.add('hidden');el('result').classList.remove('hidden');el('result').textContent=message;}
function show(next){clearInterval(timer);timer=null;phase=next;render();}
function startRest(){phase='rest';remaining=300;render();timer=setInterval(()=>{remaining--;el('countdown').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining<=0)finish(t('示例休息结束。','Demo break complete.'));},1000);}
function render(){el('copyStatus').textContent='点击切换左侧效果。当前预览第 '+(choice+1)+' 组，不代表已选定客户端正文。';el('card').classList.toggle('hidden',phase==='privacy'||phase==='dismissed');el('enter').classList.toggle('hidden',phase!=='privacy');el('result').classList.add('hidden');el('display').classList.toggle('privacy',phase==='privacy');el('reminderTab').setAttribute('aria-pressed',phase!=='privacy');el('privacyTab').setAttribute('aria-pressed',phase==='privacy');el('enter').textContent=t('进入此屏幕','Enter this screen');el('close').setAttribute('aria-label',t('关闭','Close'));el('cardTitle').textContent=phase==='rest'?t('休息倒计时','Break countdown'):t('该休息一下了','Time for a break');el('cardCopy').textContent=phase==='rest'?t('按自己的节奏休息，计时结束不会唤亮屏幕。','Rest at your own pace. The timer will not wake the display.'):copies[choice][language==='en'?2:1];el('countdown').classList.toggle('hidden',phase!=='rest');el('countdown').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');el('actions').replaceChildren();if(phase==='rest'){action(t('收起到托盘','Minimize to tray'),'primary',()=>finish(t('休息卡片已收起（演示）。','Break card minimized (demo).')));action(t('提前结束','End early'),'',()=>finish(t('本次示例休息已结束。','Demo break ended.')));}else{action(t('开始休息','Start break'),'primary',startRest);action(t('稍后','Snooze'),'',()=>finish(t('稍后再提醒你（演示，不启动真实计时）。','Reminder snoozed (demo only).')));action(t('跳过本次','Skip this time'),'quiet',()=>finish(t('本次提醒已跳过（演示）。','This reminder was skipped (demo).')));}Array.from(el('choices').children).forEach((b,i)=>b.setAttribute('aria-pressed',i===choice));}
copies.forEach((copy,i)=>{const button=document.createElement('button');button.type='button';button.className='copy-choice';button.setAttribute('aria-pressed',i===choice);const heading=document.createElement('strong');heading.textContent=(i+1)+' · '+copy[0];const text=document.createElement('span');text.textContent=copy[1];button.append(heading,text);button.onclick=()=>{choice=i;show('reminder')};el('choices').append(button)});
el('reminderTab').onclick=()=>show('reminder');el('privacyTab').onclick=()=>show('privacy');el('reset').onclick=()=>show(phase==='privacy'?'privacy':'reminder');el('enter').onclick=()=>finish(t('隐私幕已收起（演示）。','Privacy curtain dismissed (demo).'));el('close').onclick=()=>finish(t('提醒卡片已关闭（演示）。','Reminder card closed (demo).'));el('language').onchange=e=>{language=e.target.value;if(phase==='dismissed')phase='reminder';render()};render();
</script>
</body>
</html>
