<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>屏幕良伴 · 健康提醒</title>
<link rel="icon" href="settings-v2-icon.svg" type="image/svg+xml">
<!-- Continue the existing Calm palette and 430px centered card. Shapes communicate action outcomes;
     no hardware, saved preferences or real reminder cycles are accessed by this prototype. -->
<style>
:root{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#173326;background:#e4e9dd;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:28px 32px}button,select{font:inherit}button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid #648858;outline-offset:4px}
header,main,footer{max-width:1280px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{font-size:19px;font-weight:600;margin:0 0 6px}.subhead{font-size:12px;color:#5b6b5d;margin:0}
nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}nav button,nav select{border:1px solid #b6c4b0;background:transparent;color:#264632;border-radius:6px;padding:8px 12px;font-size:12px}
.display{position:relative;display:grid;place-items:center;min-height:440px;height:min(72vh,700px);border:1px solid #5f765d;border-radius:12px;background:#102a23 url('forest-mist.png') center/cover;overflow:hidden;isolation:isolate}
.display:before{content:"";position:absolute;inset:0;background:#0c281cb3;z-index:-1}
.health-card{width:430px;max-width:calc(100% - 32px);background:#17372e;color:#e8efe5;border:1px solid #3e6250;border-radius:12px;padding:24px 28px 26px;box-shadow:0 16px 48px #06190d30}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading h2{font-size:21px;font-weight:500;line-height:28px;margin:0}
.close{width:28px;height:28px;flex-shrink:0;border:0;background:transparent;color:#acc2b3;border-radius:6px;font-size:21px;line-height:1}.close:hover{background:#294c3c}
.copy{font-size:14px;line-height:24px;color:#acc2b3;margin:16px 0 22px;overflow-wrap:break-word}
.actions{display:flex;flex-direction:column;gap:12px}.secondary{display:flex;align-items:center;justify-content:space-between;gap:12px}
.action{padding:10px 14px;min-height:40px;border:1px solid #acc2b3;border-radius:7px;font-size:13px;background:transparent;color:#e8efe5;line-height:18px;transition:border-color .15s,opacity .15s}
.action:hover{border-color:#b4d6a1}.action:active{opacity:.8}.action.primary{min-height:46px;width:100%;border-radius:12px;background:#b4d6a1;color:#173326;border-color:#b4d6a1;font-weight:600}
.action.snooze{border-radius:22px;min-width:132px}.action.quiet{border:0;border-radius:0;color:#acc2b3}.action.quiet:hover{color:#e8efe5;text-decoration:underline;text-underline-offset:4px}
.health-card button:focus-visible{outline:2px solid #d4e9c6;outline-offset:3px}.countdown{font-size:48px;font-weight:300;margin:0 0 20px;font-variant-numeric:tabular-nums}
.rest-actions{display:flex;gap:8px;flex-wrap:wrap}.rest-actions .action.primary{width:auto;min-height:40px;border-radius:7px}
.result{max-width:430px;margin:24px;padding:26px 28px;background:#17372e;color:#e8efe5;border-radius:12px;line-height:1.8;font-size:14px}.result p{margin:0 0 18px}
.hidden{display:none!important}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:22px}.legend div{display:flex;gap:12px;align-items:flex-start}.legend strong{display:block;font-size:12px;font-weight:600;margin-bottom:4px}.legend p{margin:0;font-size:12px;line-height:1.7;color:#5b6b5d}
.shape{flex-shrink:0;display:block;width:32px;height:20px;margin-top:2px;background:#b4d6a1;border:1px solid #648858;border-radius:6px}.shape.pill{background:transparent;border-radius:999px}.shape.flat{background:none;border:0;border-radius:0;border-bottom:1px solid #648858;height:12px}
footer{font-size:11px;color:#637460;line-height:1.8;margin:24px auto 0}
@media(max-width:660px){body{padding:16px}header{align-items:flex-start;flex-direction:column}.display{height:500px}.health-card{padding:22px}.legend{grid-template-columns:1fr;gap:14px}.secondary{gap:6px}.action{padding:10px 12px}.action.snooze{min-width:118px}}
@media(prefers-reduced-motion:reduce){.action{transition:none}}
</style>
</head>
<body>
<header><div><h1 id="pageTitle">健康提醒 · 给自己一个休息的空隙</h1><p class="subhead" id="subtitle">确定正文 · 三种形状，对应三种选择</p></div><nav aria-label="预览控制"><button id="reset">重新预览</button><select id="language" aria-label="预览语言"><option value="zh">简体中文</option><option value="en">English</option></select></nav></header>
<main>
<div class="display" aria-label="模拟屏幕">
<section class="health-card" id="card" role="dialog" aria-labelledby="cardTitle" aria-describedby="cardCopy">
<div class="heading"><h2 id="cardTitle">该休息一下了</h2><button class="close" id="close" aria-label="关闭">×</button></div>
<p class="copy" id="cardCopy">专注了这么久，辛苦啦。眨眨眼，伸个懒腰，让紧绷的自己放松片刻...</p>
<div class="countdown hidden" id="countdown">05:00</div>
<div class="actions" id="reminderActions"><button class="action primary" id="start">开始休息</button><div class="secondary"><button class="action snooze" id="snooze">稍后</button><button class="action quiet" id="skip">跳过本次</button></div></div>
<div class="rest-actions hidden" id="restActions"><button class="action primary" id="collapse">收起到托盘</button><button class="action" id="end">提前结束</button></div>
</section>
<section class="result hidden" id="result" role="status"><p id="resultText"></p><button class="action" id="again">再次查看提醒</button></section>
</div>
<section class="legend" aria-label="按钮说明"><div><i class="shape" aria-hidden="true"></i><section><strong id="startLabel">开始休息</strong><p id="startDesc">圆角长按钮 · 现在开始休息倒计时</p></section></div><div><i class="shape pill" aria-hidden="true"></i><section><strong id="snoozeLabel">稍后</strong><p id="snoozeDesc">胶囊描边 · 按设置的时长，过会儿再提醒</p></section></div><div><i class="shape flat" aria-hidden="true"></i><section><strong id="skipLabel">跳过本次</strong><p id="skipDesc">轻量文字 · 跳过这一轮，开始新的工作周期</p></section></div></section>
</main>
<footer id="footnote">这是可点击效果稿，休息倒计时使用 5 分钟示例，不会改变客户端设置或真实工作周期。</footer>
<script>
'use strict';
const byId=id=>document.getElementById(id);
const copy={zh:{pageTitle:'健康提醒 · 给自己一个休息的空隙',subtitle:'确定正文 · 三种形状，对应三种选择',reset:'重新预览',reminderTitle:'该休息一下了',restTitle:'休息倒计时',note:'专注了这么久，辛苦啦。眨眨眼，伸个懒腰，让紧绷的自己放松片刻...',restNote:'按自己的节奏休息，计时结束不会唤亮屏幕。',start:'开始休息',snooze:'稍后',skip:'跳过本次',collapse:'收起到托盘',end:'提前结束',again:'再次查看提醒',close:'关闭',startDesc:'圆角长按钮 · 现在开始休息倒计时',snoozeDesc:'胶囊描边 · 按设置的时长，过会儿再提醒',skipDesc:'轻量文字 · 跳过这一轮，开始新的工作周期',startTip:'开始本次休息倒计时。',snoozeTip:'按设置的稍后时长，再提醒一次。',skipTip:'跳过这次提醒，开始新的工作周期。',snoozed:'稍后再提醒你。这次只是演示，不启动真实计时。',skipped:'已跳过这次提醒。客户端会开始新的工作周期。',closed:'提醒已收起。客户端会按稍后时长再次提醒。',collapsed:'休息卡片已收起。这次演示到这里结束；客户端倒计时会继续。',ended:'本次示例休息已结束。',footnote:'这是可点击效果稿，休息倒计时使用 5 分钟示例，不会改变客户端设置或真实工作周期。'},en:{pageTitle:'A little room to rest',subtitle:'One caring note. Three distinct choices.',reset:'Replay',reminderTitle:'Time for a break',restTitle:'Break countdown',note:'You’ve been focused for so long—thank you for your hard work. Blink, stretch, and give yourself a moment to unwind...',restNote:'Take your time. The timer will not wake your display.',start:'Start break',snooze:'Snooze',skip:'Skip this time',collapse:'Collapse to tray',end:'End early',again:'Show reminder again',close:'Close',startDesc:'Rounded bar · Start your break countdown now',snoozeDesc:'Outlined pill · Remind you after your chosen interval',skipDesc:'Quiet text · Skip this reminder and start a new work cycle',startTip:'Start the countdown for this break.',snoozeTip:'Remind you again after your chosen snooze interval.',skipTip:'Skip this reminder and start a new work cycle.',snoozed:'We’ll remind you later. This demo does not start a real timer.',skipped:'Reminder skipped. The app starts a new work cycle.',closed:'Reminder dismissed. The app will remind you after your snooze interval.',collapsed:'Break card minimized. This demo ends here; the app keeps its countdown running.',ended:'The demo break has ended.',footnote:'Clickable preview with a sample five-minute break. It does not change app settings or your real work cycle.'}};
let language='zh',phase='reminder',resultKey='',seconds=300,timer=null;
function stopTimer(){clearInterval(timer);timer=null;}
function render(){const c=copy[language];document.documentElement.lang=language==='zh'?'zh-CN':'en';for(const id of ['pageTitle','subtitle','reset','start','snooze','skip','collapse','end','again','startDesc','snoozeDesc','skipDesc','footnote'])byId(id).textContent=c[id];for(const action of ['start','snooze','skip']){byId(action+'Label').textContent=c[action];byId(action).title=c[action+'Tip'];}byId('close').setAttribute('aria-label',phase==='rest'?c.collapse:c.close);byId('cardTitle').textContent=phase==='rest'?c.restTitle:c.reminderTitle;byId('cardCopy').textContent=phase==='rest'?c.restNote:c.note;byId('card').classList.toggle('hidden',phase==='result');byId('result').classList.toggle('hidden',phase!=='result');byId('resultText').textContent=resultKey?c[resultKey]:'';byId('reminderActions').classList.toggle('hidden',phase!=='reminder');byId('restActions').classList.toggle('hidden',phase!=='rest');byId('countdown').classList.toggle('hidden',phase!=='rest');byId('countdown').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function reset(){stopTimer();phase='reminder';resultKey='';seconds=300;render();}
function finish(key){stopTimer();resultKey=key;phase='result';render();}
byId('start').onclick=()=>{phase='rest';seconds=300;render();timer=setInterval(()=>{seconds=Math.max(0,seconds-1);if(!seconds)finish('ended');else render();},1000);};
byId('snooze').onclick=()=>finish('snoozed');byId('skip').onclick=()=>finish('skipped');byId('collapse').onclick=()=>finish('collapsed');byId('end').onclick=()=>finish('ended');byId('close').onclick=()=>finish(phase==='rest'?'collapsed':'closed');byId('again').onclick=reset;byId('reset').onclick=reset;byId('language').onchange=e=>{language=e.target.value;render();};
render();
</script>
</body>
</html>
