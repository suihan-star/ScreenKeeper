name: Build artifacts (manual)

# Source hosting is Codeup. This optional GitHub mirror workflow never publishes a Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build local artifacts
        shell: pwsh
        run: .\build.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: screenkeeper-${{ github.sha }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*-SHA256SUMS.txt
          if-no-files-found: error
